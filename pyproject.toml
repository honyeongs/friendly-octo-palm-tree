[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netsec-ssh-analyzer"
version = "0.4.0"
description = "Explainable offline SSH authentication failure analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
packets = ["dpkt==1.9.8"]
monitor = ["fastapi==0.143.0", "uvicorn==0.54.0", "python-dotenv==1.2.4"]
saas = ["psycopg[binary]==3.3.6", "authlib==1.8.0", "httpx==0.28.1", "stripe==16.0.0", "cryptography>=46"]
test = ["httpx==0.28.1"]

[tool.setuptools.package-data]
netsec = ["web/*.html", "web/*.css", "web/*.js", "web/assets/*.svg", "web/assets/*.txt", "web/data/*.json"]
"netsec.monitor" = ["schema.sql", "ui/*.html", "ui/*.css", "ui/*.js"]
"netsec.demo" = ["ui/*.html", "ui/*.css", "ui/*.js"]
"netsec.saas" = ["schema.sql"]

[project.scripts]
netsec = "netsec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
