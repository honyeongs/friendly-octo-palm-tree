<section class="raw-input" aria-labelledby="raw-title"><div class="raw-heading"><h2 id="raw-title">SSH 로그 분석</h2><span>로그 · PCAP 각각 최대 8 MiB</span></div><form id="raw-form"><div class="raw-controls"><label>OpenSSH · journald 로그<input id="raw-log" type="file" accept=".log,.txt,.jsonl,.json" required></label><label>입력 형식<select id="raw-format"><option value="auto">자동 감지</option><option value="openssh">OpenSSH</option><option value="journal">journald JSON</option></select></label><label>탐지 구간 (초)<input id="raw-window" type="number" min="1" max="86400" value="60" required></label><label>실패 횟수<input id="raw-threshold" type="number" min="1" max="10000" value="5" required></label><button id="raw-analyze" type="submit"><img src="/assets/shield-check.svg" alt="">분석</button></div><details><summary>선택: PCAP 연결</summary><div class="raw-advanced"><label>PCAP · PCAPNG<input id="raw-pcap" type="file" accept=".pcap,.pcapng"></label><label>캡처 서버 IP<input id="raw-ip" type="text" placeholder="192.0.2.100" autocomplete="off"></label><label>로그 호스트<input id="raw-host" type="text" autocomplete="off"></label></div></details><div class="raw-status"><span id="raw-status" role="status">로그 선택 대기</span><button id="raw-cancel" type="button" hidden>취소</button><button id="raw-example" type="button">합성 로그 예제</button></div></form></section>
