name: SSH analyzer checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install '.[packets,monitor,test]'
      - name: Test parsers, detection and CLI
        run: python -m unittest discover -s tests -t . -v
      - name: Analyze the demo through the installed command
        run: netsec analyze-ssh samples/ssh/demo.log --output report.json
      - name: Save the example report
        uses: actions/upload-artifact@v4
        with:
          name: ssh-report-${{ matrix.os }}-${{ matrix.python-version }}
          path: report.json

  linux-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install analysis and local SSH lab programs
        run: |
          python -m pip install '.[packets]'
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server openssh-client tcpdump
      - name: Verify real loopback SSH, native journal and capture
        run: sudo "$(which python)" labs/ssh/run_lab.py --output lab-results
      - name: Save real lab verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ssh-lab
          path: |
            lab-results/case.json
            lab-results/report.json
            lab-results/capture.log

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test report validation and comparison
        run: node --test tests/web/*.test.mjs
      - name: Install browser test runtime
        run: |
          python -m pip install '.[monitor,test]'
          npm install --no-save --package-lock=false playwright@1.64.0
          npx playwright install --with-deps chromium
      - name: Verify desktop and mobile report workflow
        run: node tests/browser/smoke.mjs
      - name: Verify monitoring and connected sample application
        run: node tests/browser/monitor.mjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-viewer-screenshots
          path: |
            playwright-results/*.png
            monitor-results/*.png
